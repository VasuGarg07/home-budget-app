name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug -PbuildNumber=${{ github.run_number }}
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk home-budget-build-${{ github.run_number }}.apk
      - run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest home-budget-build-${{ github.run_number }}.apk --target "${{ github.sha }}" --latest --title "Build ${{ github.run_number }}" --notes "$COMMIT_MESSAGE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
