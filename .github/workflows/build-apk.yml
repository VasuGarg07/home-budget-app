name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk home-budget.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: home-budget.apk
